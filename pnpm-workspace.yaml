permissions:
  lefthook:
    # postinstall で `lefthook install` を実行し、git hook を入れる。
    build: true
  '@mizchi/mutator':
    # 同梱のエージェント向け skill は入れない。使い方は AGENTS.md の「作業環境」に書く。
    skills: false
# 公開から 1 日経っていない版を例外にした記録。版を上げたときに使われなくなった項目を消す。
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@mizchi/mutator-bun@0.5.0'
  - '@mizchi/mutator-core@0.5.0'
  - '@mizchi/mutator-jest@0.5.0'
  - '@mizchi/mutator-playwright@0.5.0'
  - '@mizchi/mutator-typecheck@0.5.0'
  - '@mizchi/mutator-vitest@0.5.0'
  - '@mizchi/mutator@0.5.0'
  - '@mizchi/test-impact@0.5.0'
# 依存が package.json・lockfile と合わないとき、スクリプトの前に install せずに失敗させる。install は
# lockfile などを書き換えるため、commit 時の検査の途中で起きると、検査した内容と commit する内容がずれる。
verifyDepsBeforeRun: error
