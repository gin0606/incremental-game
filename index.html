<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>コイン集め（仮）</title>
    <style>
      /* 買えない品物のボタンは、フォーカスを受けられるよう disabled ではなく aria-disabled で示すため、色で押せないことを示す。 */
      button[aria-disabled="true"] {
        color: GrayText;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>コイン集め（仮）</h1>
      <section id="away" aria-label="離れていた間に進んだこと" hidden>
        <p id="away-report"></p>
        <button type="button" id="away-close">閉じる</button>
      </section>
      <dl>
        <dt>コイン</dt>
        <dd id="coins"></dd>
        <dt>これまでに生産したコイン</dt>
        <dd id="total-earned"></dd>
        <dt>毎秒の生産</dt>
        <dd id="production"></dd>
        <dt>採集機</dt>
        <dd id="collectors"></dd>
        <dt>工場</dt>
        <dd id="factories"></dd>
        <dt>自動購入</dt>
        <dd id="auto-buyer"></dd>
        <dt>次に買えるまで</dt>
        <dd id="next-purchase"></dd>
        <dt id="next-unlock-label" hidden>次の解放</dt>
        <dd id="next-unlock" hidden></dd>
      </dl>
      <div id="shop"></div>
      <p id="notice" role="status" style="white-space: pre-line"></p>
    </main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
